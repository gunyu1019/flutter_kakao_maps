name: Publish to pub.dev (with example build)

on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+*'
    
jobs:
  example_web_build:
    env:
      working-directory: ./example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Access secret key 
        run: |
          mkdir assets/config/
          echo "KAKAO_API_KEY=$KAKAO_API_KEY" >> assets/config/.env
        env:
          KAKAO_API_KEY: ${{secrets.KAKAO_API_KEY}}
        working-directory: ${{ env.working-directory }}
      - name: Install Flutter SDK
        run: |
          /usr/bin/git clone https://github.com/flutter/flutter.git .flutter -b stable 
        working-directory: ${{ env.working-directory }}
      - name: Setup Flutter
        run: |
          .flutter/bin/flutter precache
        working-directory: ${{ env.working-directory }}
      - name: Install dependencies
        run: |
          .flutter/bin/flutter pub get
        working-directory: ${{ env.working-directory }}
      - name: Build Web
        run: |
          .flutter/bin/flutter build web --release --wasm --base-href /${{github.event.repository.name}}/
        working-directory: ${{ env.working-directory }}
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web
  example_android_build:
    env:
      working-directory: ./example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Access secret key 
        run: |
          mkdir assets/config/
          echo "KAKAO_API_KEY=$KAKAO_API_KEY" >> assets/config/.env
        env:
          KAKAO_API_KEY: ${{secrets.KAKAO_API_KEY}}
        working-directory: ${{ env.working-directory }}
      - name: Install Flutter SDK
        run: |
          /usr/bin/git clone https://github.com/flutter/flutter.git .flutter -b stable 
        working-directory: ${{ env.working-directory }}
      - name: Setup Flutter
        run: |
          .flutter/bin/flutter precache --android
        working-directory: ${{ env.working-directory }}
      - name: Setup Java 18 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '18'
      - name: Install dependencies
        run: |
          .flutter/bin/flutter pub get
        working-directory: ${{ env.working-directory }}
      - name: Build Application(APK)
        run: |
          .flutter/bin/flutter build apk --release 
        working-directory: ${{ env.working-directory }}
      - name: Upload application pacakge.
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: example/build/app/outputs/apk/release/app-release.apk
  publish:
    needs: example_web_build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install and setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.7.2
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.29.2
      - name: Install dependencies
        run: flutter pub get
      - name: Publish - dry run
        run: dart pub publish --dry-run
      - name: Publish to pub.dev
        run: dart pub publish -f
  android_deploy:
    needs: example_android_build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: android-apk
      url: ${{ fromJSON(steps.deployment.outputs.assets)[0].browser_download_url }}
    steps:
      - name: Download application package.
        uses: actions/download-artifact@v4
        with:
          name: application
          path: ./
      - name: Upload application pacakge to release
        id: deployment
        uses: softprops/action-gh-release@v2
        with:
          files: |
             ./app-release.apk
  web_deploy:
    environment:
      name: github-pages
      url: ${{ steps.web_deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: example_web_build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    
