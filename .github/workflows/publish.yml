name: Publish to pub.dev (with example build)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: 

jobs:
  run_lint:
    uses: ./.github/workflows/lint.yml
  example_web_build:
    runs-on: ubuntu-latest
    needs: [run_lint]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - name: Access secret key
        working-directory: ./example
        env:
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
        run: |
          mkdir -p assets/config/
          echo "KAKAO_API_KEY=$KAKAO_API_KEY" >> assets/config/.env
      - name: Install dependencies
        working-directory: ./example
        run: flutter pub get
      - name: Build Web
        working-directory: ./example
        run: flutter build web --release --wasm --base-href /${{ github.event.repository.name }}/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  example_android_build:
    runs-on: ubuntu-latest
    needs: [run_lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - name: Access secret key
        working-directory: ./example
        env:
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
        run: |
          mkdir -p assets/config/
          echo "KAKAO_API_KEY=$KAKAO_API_KEY" >> assets/config/.env
      - name: Install dependencies
        working-directory: ./example
        run: flutter pub get
      - name: Build Application(APK)
        working-directory: ./example
        run: flutter build apk --release
      - name: Upload application package
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: example/build/app/outputs/flutter-apk/app-release.apk
  example_ios_build:
    runs-on: macos-latest
    needs: [run_lint]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - name: Access secret key
        working-directory: ./example
        env:
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
        run: |
          mkdir -p assets/config/
          echo "KAKAO_API_KEY=$KAKAO_API_KEY" >> assets/config/.env
      - name: Install dependencies
        working-directory: ./example
        run: flutter pub get
      - name: Build iOS Simulator Application
        working-directory: ./example
        run: flutter build ios --simulator --debug
  publish:
    needs: [example_web_build, example_android_build, example_ios_build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - name: Install dependencies
        run: flutter pub get
      - name: Restore files rewritten by Flutter project migrators
        # Flutter 3.47's `pub get` auto-rewrites tracked files (e.g. adds an
        # `analyzer: exclude:` block to analysis_options.yaml). `dart pub publish`
        # then fails/warns on the dirty tree, so publish exactly the tagged state.
        run: git checkout -- .
      - name: Publish - dry run
        run: dart pub publish --dry-run
      - name: Publish to pub.dev
        run: dart pub publish -f
  android_deploy:
    needs: example_android_build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: android-apk
    steps:
      - name: Download application package
        uses: actions/download-artifact@v4
        with:
          name: application
          path: ./
      - name: Upload application package to release
        uses: softprops/action-gh-release@v2
        with:
          files: ./app-release.apk
  web_deploy:
    needs: example_web_build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
