name: Dependency Inspector

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check_latest_version_android:
    name: Check latest version of Android
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.android.outputs.version }}
    steps:
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Get latest version of KakaoMapsSDK from maven central
        id: android
        run: |
          META_URL="https://devrepo.kakao.com/nexus/repository/kakaomap-releases/com/kakao/maps/open/android/maven-metadata.xml"
          METADATA=$(curl -s "$META_URL")

          LATEST_VERSION=$(echo "$METADATA" | xmllint --xpath "string(//release)" - 2>/dev/null)
          if [ -z "$LATEST_VERSION" ]; then
            LATEST_VERSION=$(echo "$METADATA" | xmllint --xpath "string(//latest)" -)
          fi

          echo "The latest version of Kakao Map SDK (Android) is $LATEST_VERSION"
          echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

  check_latest_version_ios:
    name: Check latest version of iOS
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ios.outputs.version }}
    steps:
      - name: Get latest version of KakaoMapsSDK-SPM
        id: ios
        run: |
          LATEST_VERSION=$(git ls-remote --tags --refs https://github.com/kakao-mapsSDK/KakaoMapsSDK-SPM.git \
            | awk -F/ '{print $NF}' \
            | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V -r \
            | head -n1)

          echo "The latest version of Kakao Map SDK (iOS) is $LATEST_VERSION"
          echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

  update_dependency:
    name: Update dependency
    runs-on: ubuntu-latest
    needs: [check_latest_version_android, check_latest_version_ios]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch
        id: create_branch
        run: |
          BRANCH_NAME="auto-update/${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          BASE_SHA=$(git rev-parse HEAD)
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Update dependency version of Android
        env:
          LATEST_ANDROID_VERSION: ${{ needs.check_latest_version_android.outputs.version }}
        run: |
          CURRENT_ANDROID_VERSION=$(grep -E '"implementation"\(\"com.kakao.maps.open:android:[0-9]+\.[0-9]+\.[0-9]+\"\)' android/build.gradle.kts \
            | awk -F'"' '{print $4}' \
            | awk -F':' '{print $3}')
          echo "Current Android version is $CURRENT_ANDROID_VERSION"
          echo "Latest Android version is $LATEST_ANDROID_VERSION"

          if [ -n "$LATEST_ANDROID_VERSION" ] && [ "$LATEST_ANDROID_VERSION" != "$CURRENT_ANDROID_VERSION" ]; then
            sed -i -E "s/com\.kakao\.maps\.open:android:[0-9]+\.[0-9]+\.[0-9]+/com.kakao.maps.open:android:$LATEST_ANDROID_VERSION/g" android/build.gradle.kts
            git commit -am "[Feat] Bump Android Kakao Map SDK version to $LATEST_ANDROID_VERSION"
          fi

      - name: Update dependency version of iOS
        env:
          LATEST_IOS_VERSION: ${{ needs.check_latest_version_ios.outputs.version }}
        run: |
          CURRENT_IOS_VERSION=$(grep -E "KakaoMapsSDK', '?[0-9]+\.[0-9]+\.[0-9]+'$" ios/kakao_map_sdk.podspec \
            | awk -F' ' '{print $3}' \
            | sed "s/'//g")
          echo "Current iOS version is $CURRENT_IOS_VERSION"
          echo "Latest iOS version is $LATEST_IOS_VERSION"

          if [ -n "$LATEST_IOS_VERSION" ] && [ "$LATEST_IOS_VERSION" != "$CURRENT_IOS_VERSION" ]; then
            sed -i -E "s/'KakaoMapsSDK', '[0-9]+\.[0-9]+\.[0-9]+'/'KakaoMapsSDK', '$LATEST_IOS_VERSION'/g" ios/kakao_map_sdk.podspec
            git commit -am "[Feat] Bump iOS Kakao Map SDK version to $LATEST_IOS_VERSION"
          fi

      - name: Push changes
        id: push_changes
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ steps.create_branch.outputs.base_sha }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git push origin "${{ steps.create_branch.outputs.branch_name }}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Pull Request
        if: steps.push_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > PULL_REQUST_BODY.md << 'EOF'
          ## Change Log
          Auto bumped Kakao Map SDK version.
          - Android: ${{ needs.check_latest_version_android.outputs.version }}
          - iOS: ${{ needs.check_latest_version_ios.outputs.version }}

          ## Checklist
          - [ ] If code changes were made then they have been tested.
              - [ ] I have updated the documentation to reflect the changes.
          - [ ] This PR fixes an issue.
          - [x] This PR adds something new (e.g. new method or parameters).
          - [ ] This PR is a breaking change (e.g. methods or parameters removed/renamed)
          EOF
          
          gh pr create \
            --title "[Auto] Bump Kakao Map SDK version" \
            --body-file pr_body.md \
            --base main \
            --head "${{ steps.create_branch.outputs.branch_name }}"